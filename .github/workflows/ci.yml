name: CI

# There was no CI at all — no `.github/` directory existed. Running the checks
# locally showed why that mattered: `tsc --noEmit` and `next build` were clean
# and the test suite passed, but **eslint reported 65 errors**, and Next 16 no
# longer runs ESLint during `next build`, so those errors had never blocked a
# deploy and never would.
#
# This runs everything on every push and PR.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A new push supersedes an in-flight run for the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # `next build` and the auth module both fail closed without these. They are
  # not secrets in CI — nothing here talks to a real database or provider; the
  # values only have to be well-formed enough to get past the boot-time guards
  # in src/lib/auth.ts and src/lib/db.ts.
  BETTER_AUTH_SECRET: ci-placeholder-secret-at-least-32-characters
  BETTER_AUTH_URL: http://localhost:3000
  NEXT_PUBLIC_BETTER_AUTH_URL: http://localhost:3000
  DATABASE_URL: postgres://ci:ci@localhost:5432/ci
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: typecheck · test · lint · build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` rather than `npm install`: the lockfile is the input, and a
      # silently-updated dependency tree is exactly what CI exists to prevent.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Runs before the build because it is the fastest signal, and because the
      # DB-backed suites (multi-tenant isolation, TOCTOU, token-refresh races,
      # coin exploits) are the ones worth failing fast on.
      - name: Test
        run: npx vitest run

      # ── ESLint ratchet ────────────────────────────────────────────────────
      # The repository currently has 62 errors and 125 warnings. Blocking on
      # zero would mean either a large cleanup before CI can exist at all, or —
      # far more likely — CI never being turned on.
      #
      # So: errors are capped at the current count and warnings at the current
      # count. New problems fail the build; the existing ones are paid down
      # separately, and each time the number drops, LOWER IT HERE. A ratchet
      # only works if it is tightened.
      - name: Lint (ratcheted)
        run: |
          set -o pipefail
          npx eslint . -f json --output-file eslint-report.json || true
          node -e "
            const r = require('./eslint-report.json');
            const errors = r.reduce((n, f) => n + f.errorCount, 0);
            const warnings = r.reduce((n, f) => n + f.warningCount, 0);
            const MAX_ERRORS = 58;
            const MAX_WARNINGS = 119;
            console.log('eslint: ' + errors + ' errors, ' + warnings + ' warnings');
            console.log('budget: ' + MAX_ERRORS + ' errors, ' + MAX_WARNINGS + ' warnings');
            if (errors > MAX_ERRORS || warnings > MAX_WARNINGS) {
              console.error('New lint problems introduced. Fix them, or if you removed some, lower the budget in .github/workflows/ci.yml.');
              process.exit(1);
            }
            if (errors < MAX_ERRORS || warnings < MAX_WARNINGS) {
              console.log('Budget is now slack — please lower MAX_ERRORS/MAX_WARNINGS in .github/workflows/ci.yml.');
            }
          "

      - name: Build
        run: npx next build

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eslint-report
          path: eslint-report.json
          if-no-files-found: ignore

  # ── End-to-end ─────────────────────────────────────────────────────────────
  # Sixteen Playwright specs existed in `tests/e2e` and had never run in CI.
  # They could not have: they faked guest mode in localStorage on the premise
  # that routes were not gated server-side, which stopped being true when route
  # protection moved into `proxy.ts` — and there was no database they were
  # allowed to talk to, because the Neon serverless driver cannot speak to a
  # plain Postgres.
  #
  # Both are fixed. This runs them against a disposable Postgres, through Neon's
  # own `wsproxy`, so the app uses the identical driver and transaction
  # semantics it uses in production.
  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: lumina_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U e2e -d lumina_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # Translates the driver's WebSocket protocol to raw Postgres.
      wsproxy:
        image: ghcr.io/neondatabase/wsproxy:latest
        env:
          ALLOW_ADDR_REGEX: '.*'
        ports: ['5433:80']

    env:
      # `postgres` is the service hostname on the runner network, which is what
      # wsproxy dials; `NEON_WS_PROXY` is where THIS process finds the proxy.
      # They are deliberately different — see src/lib/db.ts.
      DATABASE_URL: postgres://e2e:e2e@postgres:5432/lumina_e2e
      NEON_WS_PROXY: localhost:5433
      BETTER_AUTH_SECRET: ci-placeholder-secret-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_BETTER_AUTH_URL: http://localhost:3000
      E2E_BASE_URL: http://localhost:3000
      # `next start` sets NODE_ENV=production, which used to 404 the editor QA
      # harness at /dev-editor-test and fail all 29 specs in editor.spec.ts on
      # every run. The harness is opt-in now rather than NODE_ENV-gated; this
      # is the opt-in. A real deployment never sets it, so the route stays
      # unreachable there.
      NEXT_PUBLIC_E2E_EDITOR_HARNESS: '1'
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Only Chromium — the suite's three projects are all Chromium-based, and
      # downloading Firefox and WebKit would add minutes for nothing.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # The same script a human runs against a drifted database. Using it here
      # means CI exercises it on every push, which is how it stays correct.
      - name: Apply schema
        run: psql "postgres://e2e:e2e@localhost:5432/lumina_e2e" -v ON_ERROR_STOP=1 -f scripts/catch-up-schema.sql

      - name: Build
        run: npx next build

      # `next start`, not `next dev`: e2e should exercise the bundle that ships.
      - name: Start app
        run: |
          npx next start -p 3000 &
          npx wait-on http://localhost:3000/auth/signin --timeout 120000

      - name: Playwright
        run: npx playwright test

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
