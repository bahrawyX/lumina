<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumina — Offline</title>
  <style>
    body {
      background: #09090b;
      color: #fafafa;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      flex-direction: column;
      gap: 16px;
      text-align: center;
      padding: 24px;
    }
    .icon {
      width: 64px;
      height: 64px;
      background: #6D59E0;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 700;
      color: white;
      margin-bottom: 8px;
    }
    h1 { font-size: 1.5rem; font-weight: 600; margin: 0; }
    p { color: #a1a1aa; font-size: 0.9rem; margin: 0; line-height: 1.5; }
    button {
      background: #6D59E0;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="icon">L</div>
  <h1>You're offline</h1>
  <p>Lumina needs a connection to sync your data.<br>
     Your cached data is still available.</p>
  <button onclick="window.location.reload()">Try again</button>
</body>
</html>
